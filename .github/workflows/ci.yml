name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # `check` without --fix: a fixing lint rewrites files in the runner and
      # exits 0, so it can never fail the build.
      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest
